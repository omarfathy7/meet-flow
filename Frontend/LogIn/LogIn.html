<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="LogIn.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <div class="page-container">
    <!-- Left Hero -->
    <div class="left-panel">
      <div class="logo">
        <i class="fa-solid fa-video"></i>
        <span>MeetFlow</span>
      </div>

      <div class="hero-content">
        <h1>Manage Your Meetings<br>Seamlessly</h1>
        <p>Collaborate with your team, track tasks, and generate reports all in one place.</p>

        <div class="feature-card">
          <i class="fa-solid fa-chart-line"></i>
        </div>
      </div>
    </div>

    <!-- Right Form -->
    <div class="right-panel">
      <div class="form-wrapper">
        <h2 class="welcome-title">Welcome Back</h2>
        <p class="subtitle">Log in to your account to continue</p>

        <!-- SVG Icons -->
        <div class="social-buttons">
          <button type="button" class="btn-social" id="googleBtn">
            <svg class="social-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
              <path fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
            </svg>
            <span>Google</span>
          </button>

          <button type="button" class="btn-social" id="appleBtn">
            <svg class="social-icon" viewBox="0 0 170 170" width="18" height="18">
              <path fill="#000000"
                d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.14-1.9-14.41-6.1-3.26-2.64-7.14-7.24-11.64-13.82-7.17-10.43-12.59-21.84-16.25-34.22-3.66-12.38-5.49-24.11-5.49-35.19 0-14.33 3.61-26.3 10.83-35.91 7.22-9.61 16.32-14.53 27.3-14.76 4.99 0 10.37 1.2 16.14 3.6 5.77 2.4 9.68 3.65 11.73 3.75 2.61 0 6.78-1.35 12.51-4.05 5.73-2.7 10.84-3.95 15.33-3.75 11.95.76 21.43 5.38 28.44 13.86-10.65 6.42-15.86 15.34-15.63 26.77.22 9.02 3.69 16.53 10.41 22.53 6.72 6 14.65 9.4 23.8 10.2-2.5 7.61-5.88 15.02-10.14 22.23zm-31.5-103.88c0 6.31-2.31 12.3-6.93 17.97-4.62 5.67-10.37 9.12-17.25 10.35-.43-1.63-.65-3.26-.65-4.89 0-6.19 2.39-12.28 7.17-18.27 4.78-5.99 10.7-9.58 17.76-10.77.1 1.85.15 3.39.15 4.61z" />
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <div class="divider">
          <span>OR</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@company.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Enter your password" required>
              <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember">
              <span>Remember me</span>
            </label>
            <a href="../ForgotPassword/ForgotPassword.html" class="forgot-pass">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Log in</button>
        </form>

        <p class="signup-text">
          Don't have an account?
          <a href="../CreatAccount/CreatAcount.html">Sign Up</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../api.js"></script>
  <script src="LogIn.js"></script>
</body>

</html>
