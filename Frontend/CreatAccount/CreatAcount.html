<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreateAccount</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- مكتبة intl-tel-input لمفاتيح وأعلام كل دول العالم -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css" />

  <link rel="stylesheet" href="CreatAcount.css">

  <!-- Google & Apple SDKs -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/js/api/v1/appleid/auth.js"></script>
</head>
<body>

  <div class="container">
    <!-- Left Side -->
    <div class="left-panel">
      <div class="brand">
        <i class="fa-solid fa-video"></i>
        <span>MeetFlow</span>
      </div>

      <div class="left-content">
        <h1>Start Your Journey With Us</h1>
        <p>Join thousands of teams improving their productivity <br> with MeetFlow.</p>

        <div class="preview-card">
          <i class="fa-solid fa-users"></i>
        </div>
      </div>
    </div>

    <!-- Right Side -->
    <div class="right-panel">
      <div class="form-wrapper">
        <h2 class="title-hover">Create Account</h2>
        <p class="subtitle">Set up your account in just a few minutes</p>

        <div class="social-buttons">
          <button type="button" class="btn-social" id="googleBtn">
            <svg class="social-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Google
          </button>
          
          <button type="button" class="btn-social" id="appleBtn">
            <svg class="social-icon" viewBox="0 0 24 24" width="18" height="18" fill="#000000">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.66-.8 1.11-1.92.99-3.05-1 .04-2.2.67-2.91 1.5-.62.72-1.16 1.87-1.01 2.98 1.12.09 2.26-.58 2.93-1.43z"/>
            </svg>
            Apple
          </button>
        </div>

        <div class="divider">
          <span>OR</span>
        </div>

        <!-- Form -->
        <form id="registerForm" onsubmit="return false;">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" placeholder="Doe" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Work Email</label>
            <input type="email" id="email" placeholder="name@company.com" required>
          </div>

          <div class="form-row">
            <div class="form-group password-wrapper">
              <label for="password">Password</label>
              <div class="input-eye-container">
                <input type="password" id="password" placeholder="Create password" required>
                <i class="fa-solid fa-eye toggle-password" data-target="password"></i>
              </div>
            </div>
            <div class="form-group password-wrapper">
              <label for="confirmPassword">Confirm Password</label>
              <div class="input-eye-container">
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group phone-group">
              <label for="phone">Mobile number</label>
              <div class="phone-input-wrapper">
                <input 
                  type="tel" 
                  id="phone" 
                  placeholder="123456789" 
                  inputmode="numeric" 
                  oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                  required>
              </div>
            </div>
          </div>

          <div class="terms-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
          </div>

          <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="login-link">
          Already have an account? <a href="../LogIn/LogIn.html">Log In</a>
        </p>
      </div>
    </div>
  </div>

  <!-- JS مفاتيح الدول والأعلام -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
  <script src="../api.js"></script>
  <script src="CreatAcount.js"></script>
</body>
</html>
